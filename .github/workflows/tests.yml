name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi==0.162.0 uvicorn==0.54.0 pydantic==2.14.3
          pip install pandas==3.1.1 numpy==2.5.4 scipy==1.18.1
          pip install scikit-learn==1.9.1 skops==0.16.0
          pip install xgboost==3.4.1 pytest

      - name: Run tests
        run: python -m pytest -q